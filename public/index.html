<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kaze Komik (Komiku)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background: #0f0f0f; color: #e0e0e0; padding-bottom: 20px; overflow-x: hidden; }

  header { background: rgba(30, 30, 30, 0.95); backdrop-filter: blur(10px); padding: 15px; text-align: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #2a2a2a; }
  header h1 { font-size: 20px; color: #ff3d00; letter-spacing: 1px; font-weight: 800; }

  #grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 12px; padding: 15px; }
  .card { background: #1e1e1e; border-radius: 10px; overflow: hidden; cursor: pointer; position: relative; border: 1px solid #2a2a2a; transition: 0.2s; }
  .card:active { transform: scale(0.96); }
  .card img { width: 100%; height: 150px; object-fit: cover; display: block; background: #2a2a2a; }
  .card .title { font-size: 12px; margin: 10px 8px; text-align: center; font-weight: 600; color: #fff; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; }

  .loading { text-align: center; color: #888; padding: 30px; width: 100%; grid-column: 1/-1; font-size: 14px; }
  .error-box { text-align: center; padding: 30px 20px; background: #1e1e1e; border-radius: 10px; border: 1px dashed #ff3d00; margin: 15px; grid-column: 1/-1;}
  .error-box p { color: #ff3d00; font-weight: bold; margin-bottom: 10px; font-size: 16px; }

  /* DETAIL & READER */
  #detail, #reader { display: none; padding: 15px; }
  .back-btn { background: #2a2a2a; color: #fff; border: none; padding: 10px 15px; border-radius: 8px; margin-bottom: 15px; cursor: pointer; font-weight: bold; }
  .info { display: flex; gap: 15px; margin-bottom: 20px; }
  .info img { width: 110px; height: 160px; border-radius: 10px; object-fit: cover; border: 2px solid #2a2a2a;}
  .info-data h2 { font-size: 18px; color: #fff; margin-bottom: 5px; line-height: 1.3; }
  .info-data p { font-size: 13px; color: #bbb; line-height: 1.5; margin-top: 10px; }

  h3 { font-size: 16px; margin-bottom: 15px; border-left: 4px solid #ff3d00; padding-left: 10px; color: #fff; }
  .ch-item { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; font-size: 14px; font-weight: bold; display: flex; justify-content: space-between; border: 1px solid #2a2a2a; }

  #reader { padding: 0; background: #000; min-height: 100vh; }
  #reader-header { position: sticky; top: 0; background: rgba(30, 30, 30, 0.95); backdrop-filter: blur(10px); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a2a; z-index: 10;}
  #reader-header button { background: #ff3d00; color: #fff; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; }
  #reader-img img { width: 100%; display: block; margin-bottom: 2px; }
</style>
</head>
<body>

<div id="home">
  <header><h1>🥷 Kaze Komik</h1></header>
  <div id="grid-container">
      <div class="loading">Memuat data komik...</div>
  </div>
</div>

<div id="detail">
  <button class="back-btn" onclick="kembali()">← Kembali</button>
  <div id="detail-info"></div>
  <h3>Daftar Chapter</h3>
  <div id="chapter-list"></div>
</div>

<div id="reader">
  <div id="reader-header">
    <button onclick="tutupReader()">✕ Tutup</button>
    <div class="ch-title" id="reader-ch-title" style="font-weight:bold; color:#fff;">Chapter</div>
    <div style="width: 60px;"></div>
  </div>
  <div id="reader-img"></div>
</div>

<script>
// PAKAI API WEEBS SCRAPER YANG LO TEMUIN
const API_URL = "https://weeb-scraper.onrender.com/api";

async function getAPI(path) {
  const res = await fetch(API_URL + path);
  return await res.json();
}

async function muatData() {
    const grid = document.getElementById("grid-container");
    try {
        // Ambil data komik populer dari Komiku
        const data = await getAPI(`/komiku/terbaru`);
        
        grid.innerHTML = "";
        if (!data || !data.data || data.data.length === 0) {
            grid.innerHTML = "<p style='text-align:center; color:#888; grid-column:1/-1;'>Data kosong.</p>";
            return;
        }

        data.data.forEach(m => {
            const card = document.createElement("div");
            card.className = "card";
            // Kita pake 'param' buat link detailnya
            card.onclick = () => bukaDetail(m.param);
            card.innerHTML = `
              <img src="${m.thumbnail}" onerror="this.src='https://via.placeholder.com/150x200/333/fff?text=Error'">
              <div class="title">${m.title}</div>
            `;
            grid.appendChild(card);
        });
    } catch (e) {
        grid.innerHTML = `<div class="error-box"><p>⚠️ Gagal Memuat</p><span style="color:#aaa; font-size:12px;">API Weebs Scraper mungkin sedang sibuk. Coba lagi nanti.</span></div>`;
    }
}

async function bukaDetail(param) {
  document.getElementById("home").style.display = "none";
  document.getElementById("detail").style.display = "block";
  document.getElementById("chapter-list").innerHTML = "<div class='loading'>Memuat chapter...</div>";
  window.scrollTo(0, 0);

  try {
    const data = await getAPI(`/komiku/${param}`);
    
    let desc = data.description || "Tidak ada deskripsi.";
    
    document.getElementById("detail-info").innerHTML = `
      <div class="info">
        <img src="${data.thumbnail || 'https://via.placeholder.com/150x200/333/fff?text=Error'}">
        <div class="info-data">
          <h2>${data.title}</h2>
          <p>${desc.substring(0, 200)}...</p>
        </div>
      </div>
    `;

    const list = document.getElementById("chapter-list");
    list.innerHTML = "";

    if (!data.chapters || data.chapters.length === 0) {
      list.innerHTML = "<p style='color:#888; text-align:center;'>Belum ada chapter.</p>";
      return;
    }

    data.chapters.forEach((ch) => {
      const div = document.createElement("div");
      div.className = "ch-item";
      div.innerHTML = `<div>${ch.title}</div>`;
      div.onclick = () => bacaChapter(ch.param, ch.title);
      list.appendChild(div);
    });
  } catch (e) {
    document.getElementById("chapter-list").innerHTML = "<p style='color:red; text-align:center;'>Gagal memuat chapter.</p>";
  }
}

async function bacaChapter(chParam, chTitle) {
  document.getElementById("detail").style.display = "none";
  document.getElementById("reader").style.display = "block";
  document.getElementById("reader-img").innerHTML = "<div class='loading' style='color:#fff;'>Memuat gambar...</div>";
  document.getElementById("reader-ch-title").innerText = chTitle;
  window.scrollTo(0, 0);

  try {
    // Ambil gambar chapter
    const data = await getAPI(`/komiku/${chParam}`);
    
    const container = document.getElementById("reader-img");
    container.innerHTML = "";

    if (!data.images || data.images.length === 0) {
        container.innerHTML = "<p style='color:red; text-align:center;'>Gambar tidak tersedia.</p>";
        return;
    }

    data.images.forEach(imgUrl => {
      const img = document.createElement("img");
      img.src = imgUrl;
      img.loading = "lazy";
      img.onerror = function() { this.style.display = 'none'; }; 
      container.appendChild(img);
    });

  } catch (e) {
    document.getElementById("reader-img").innerHTML = "<p style='color:red; text-align:center;'>Gagal memuat gambar.</p>";
  }
}

function kembali() {
  document.getElementById("detail").style.display = "none";
  document.getElementById("home").style.display = "block";
}
function tutupReader() {
  document.getElementById("reader").style.display = "none";
  document.getElementById("detail").style.display = "block";
  document.getElementById("reader-img").innerHTML = "";
}

// Mulai
muatData();
</script>
</body>
</html>
