<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaze Komik</title>
<style>
  body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 15px; }
  h2 { text-align: center; color: #d32f2f; margin-bottom: 15px; }
  
  /* Perbaikan tampilan kotak pencarian */
  .search-box { 
    width: 100%; 
    padding: 12px 15px; 
    border: 1px solid #ddd; 
    border-radius: 25px; 
    margin-bottom: 20px; 
    box-sizing: border-box; 
    font-size: 14px; 
    outline: none;
    -webkit-appearance: none; /* Biar ga di-zoom otomatis di HP */
  }
  .search-box:focus { border-color: #d32f2f; }

  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
  .card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; }
  .card img { width: 100%; height: 160px; object-fit: cover; background: #ddd; }
  .card p { font-size: 12px; margin: 8px; text-align: center; font-weight: bold; line-height: 1.2; }
  .loading { text-align: center; color: #888; width: 100%; grid-column: 1/-1; padding: 20px; }
  
  #detail, #reader { display: none; background: white; padding: 15px; border-radius: 8px; }
  .back { background: #d32f2f; color: white; border: none; padding: 10px 15px; border-radius: 5px; margin-bottom: 15px; cursor: pointer; font-weight: bold; }
  .info { display: flex; gap: 15px; margin-bottom: 15px; }
  .info img { width: 120px; border-radius: 8px; object-fit: cover; }
  .info h3 { margin: 0 0 5px 0; font-size: 18px; }
  .info p { margin: 3px 0; font-size: 13px; color: #666; }
  .ch-item { background: #f9f9f9; padding: 12px; border-bottom: 1px solid #ddd; cursor: pointer; font-size: 14px; }
  .ch-item:active { background: #ffebee; }
  #reader img { width: 100%; display: block; margin-bottom: 5px; }
</style>
</head>
<body>

<div id="home">
  <h2>🥷 Kaze Komik</h2>
  <!-- Input Pencarian -->
  <input type="text" id="search" class="search-box" placeholder="🔍 Cari judul komik..." oninput="cariKomik()">
  
  <div id="grid">
    <div class="loading">Memuat data komik...</div>
  </div>
</div>

<div id="detail">
  <button class="back" onclick="kembali()">← Kembali</button>
  <div id="detail-info"></div>
  <h4 style="margin-top:20px;">Daftar Chapter:</h4>
  <div id="chapter-list"></div>
</div>

<div id="reader">
  <button class="back" onclick="tutupReader()">← Tutup</button>
  <div id="reader-img"></div>
</div>

<script>
const PROXY = "https://jembatan1.raditgaring1.workers.dev"; 
const API = "https://api.mangadex.org";

async function getAPI(path) {
  try {
    const url = PROXY + "/?url=" + encodeURIComponent(API + path);
    const res = await fetch(url);
    const json = await res.json();
    if (json.result === 'error' || json.errors) {
       throw new Error(json.errors ? json.errors[0].detail : "Error dari API");
    }
    return json;
  } catch (e) {
    throw e;
  }
}

function getImg(url) {
  return PROXY + "/?url=" + encodeURIComponent(url);
}

// Fungsi ngambil judul (Prioritas Bahasa Inggris)
function getTitle(m) {
  if (!m.attributes.title) return "Tanpa Judul";
  return m.attributes.title.en || m.attributes.title['ja-ro'] || Object.values(m.attributes.title)[0];
}

function renderKomik(dataList) {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  if (!dataList || dataList.length === 0) {
    grid.innerHTML = "<p style='color:#d32f2f; text-align:center; width:100%;'>Komik tidak ditemukan 😅</p>";
    return;
  }

  dataList.forEach(m => {
    const judul = getTitle(m);
    let cover = "https://via.placeholder.com/150x200?text=No+Cover";
    const coverRel = m.relationships.find(r => r.type === "cover_art");
    if (coverRel && coverRel.attributes && coverRel.attributes.fileName) {
      cover = getImg(`https://uploads.mangadex.org/covers/${m.id}/${coverRel.attributes.fileName}.256.jpg`);
    }

    const card = document.createElement("div");
    card.className = "card";
    card.onclick = () => bukaDetail(m.id);
    card.innerHTML = `<img src="${cover}" loading="lazy"><p>${judul}</p>`;
    grid.appendChild(card);
  });
}

async function loadKomik() {
  try {
    document.getElementById("grid").innerHTML = "<div class='loading'>Memuat data komik...</div>";
    const data = await getAPI("/manga?limit=50&order[followedCount]=desc&includes[]=cover_art");
    renderKomik(data.data);
  } catch (err) {
    document.getElementById("grid").innerHTML = `<div class="loading" style="color:red;">Gagal: ${err.message}</div>`;
  }
}

// Fitur Pencarian
let searchTimer;
function cariKomik() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    const query = document.getElementById("search").value.trim();
    if (!query) { loadKomik(); return; }
    
    try {
      document.getElementById("grid").innerHTML = "<div class='loading'>Mencari komik...</div>";
      const data = await getAPI(`/manga?limit=50&title=${encodeURIComponent(query)}&includes[]=cover_art`);
      renderKomik(data.data);
    } catch (err) {
      document.getElementById("grid").innerHTML = `<div class="loading" style="color:red;">Gagal mencari: ${err.message}</div>`;
    }
  }, 800); 
}

async function bukaDetail(id) {
  document.getElementById("home").style.display = "none";
  document.getElementById("detail").style.display = "block";
  document.getElementById("chapter-list").innerHTML = "Memuat chapter...";
  window.scrollTo(0, 0);

  try {
    const data = await getAPI(`/manga/${id}?includes[]=cover_art`);
    const m = data.data;
    const judul = getTitle(m);
    
    let deskripsi = "Tidak ada deskripsi.";
    if (m.attributes.description) {
        deskripsi = m.attributes.description.en || m.attributes.description.id || Object.values(m.attributes.description)[0] || deskripsi;
    }

    let cover = "";
    const coverRel = m.relationships.find(r => r.type === "cover_art");
    if (coverRel && coverRel.attributes) {
        cover = getImg(`https://uploads.mangadex.org/covers/${m.id}/${coverRel.attributes.fileName}.256.jpg`);
    }

    document.getElementById("detail-info").innerHTML = `
      <div class="info">
        <img src="${cover}">
        <div>
          <h3>${judul}</h3>
          <p>Status: ${m.attributes.status || "-"}</p>
          <p style="margin-top:5px;">${deskripsi.substring(0, 100)}...</p>
        </div>
      </div>
    `;

    // Filter chapter bahasa Indonesia
    const feed = await getAPI(`/manga/${id}/feed?limit=100&translated-language[]=id&order[chapter]=desc`);
    const list = document.getElementById("chapter-list");
    list.innerHTML = "";

    if (!feed.data || feed.data.length === 0) {
      list.innerHTML = "<p style='color:#888;'>Belum ada chapter bahasa Indonesia.</p>";
      return;
    }

    feed.data.forEach(ch => {
      const div = document.createElement("div");
      div.className = "ch-item";
      div.innerText = `Chapter ${ch.attributes.chapter || "?"}`;
      div.onclick = () => bacaChapter(ch.id);
      list.appendChild(div);
    });

  } catch (err) {
    alert("Gagal buka detail: " + err.message);
  }
}

async function bacaChapter(chapterId) {
  document.getElementById("detail").style.display = "none";
  document.getElementById("reader").style.display = "block";
  document.getElementById("reader-img").innerHTML = "Memuat gambar...";
  window.scrollTo(0, 0);

  try {
    const data = await getAPI(`/at-home/server/${chapterId}`);
    const baseUrl = data.baseUrl;
    const hash = data.chapter.hash;
    const pages = data.chapter.data; 

    const container = document.getElementById("reader-img");
    container.innerHTML = "";

    if (!pages || pages.length === 0) {
        container.innerHTML = "<p style='color:red;'>Gambar tidak tersedia.</p>";
        return;
    }

    pages.forEach(file => {
      const imgUrl = getImg(`${baseUrl}/data/${hash}/${file}`);
      const img = document.createElement("img");
      img.src = imgUrl;
      img.loading = "lazy";
      container.appendChild(img);
    });

  } catch (err) {
    document.getElementById("reader-img").innerHTML = `<p style="color:red;">Gagal memuat gambar: ${err.message}</p>`;
  }
}

function kembali() {
  document.getElementById("detail").style.display = "none";
  document.getElementById("home").style.display = "block";
}
function tutupReader() {
  document.getElementById("reader").style.display = "none";
  document.getElementById("detail").style.display = "block";
}

loadKomik();
</script>
</body>
</html>
